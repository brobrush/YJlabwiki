<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="200" height="200">
  <!-- 放射光芒：整体缓慢旋转，纯 SVG，无外部依赖 -->
  <g opacity="0.5">
    <animateTransform attributeName="transform" type="rotate"
                      from="0" to="360" dur="9s" repeatCount="indefinite"/>
    <polygon points="0.0,4.2 96.0,0.0 0.0,-4.2" fill="#fff3a0"/>
    <polygon points="-1.3,2.3 53.7,31.0 1.3,-2.3" fill="#ffb300"/>
    <polygon points="-3.6,2.1 48.0,83.1 3.6,-2.1" fill="#fff3a0"/>
    <polygon points="-2.6,0.0 0.0,62.0 2.6,0.0" fill="#ffb300"/>
    <polygon points="-3.6,-2.1 -48.0,83.1 3.6,2.1" fill="#fff3a0"/>
    <polygon points="-1.3,-2.3 -53.7,31.0 1.3,2.3" fill="#ffb300"/>
    <polygon points="-0.0,-4.2 -96.0,0.0 0.0,4.2" fill="#fff3a0"/>
    <polygon points="1.3,-2.3 -53.7,-31.0 -1.3,2.3" fill="#ffb300"/>
    <polygon points="3.6,-2.1 -48.0,-83.1 -3.6,2.1" fill="#fff3a0"/>
    <polygon points="2.6,-0.0 -0.0,-62.0 -2.6,0.0" fill="#ffb300"/>
    <polygon points="3.6,2.1 48.0,-83.1 -3.6,-2.1" fill="#fff3a0"/>
    <polygon points="1.3,2.3 53.7,-31.0 -1.3,-2.3" fill="#ffb300"/>
  </g>
</svg>
