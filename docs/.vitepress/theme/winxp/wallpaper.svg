<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <!--
    XP 风格墙纸：蓝天 + 白云 + 平整绿丘。

    这是本仓库自绘的 SVG，**不是**微软的「Bliss」原图 —— Bliss 是 Charles O'Rear
    拍摄、版权归微软的商业素材。这里只借用同样的构图语言：
    干净的天空渐变 + 一条平缓横贯画面的绿色山脊线。

    画布 16:9，配合 preserveAspectRatio="slice"，在常见屏幕上铺满时裁切最少。

    ⚠️ 只画**一层**山丘。早先为了做层次叠了两三层硬边路径，
    它们的斜边互相切割，草地上出现好几条直的色带，很难看 ——
    纵深交给渐变本身去表达就够了。
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d4a97" />
      <stop offset="0.22" stop-color="#2a76c8" />
      <stop offset="0.44" stop-color="#5aa2e0" />
      <stop offset="0.58" stop-color="#94c8ee" />
      <stop offset="0.67" stop-color="#cfe7f8" />
    </linearGradient>

    <!-- 山丘：山脊处最亮（被阳光照着），往下逐渐转深 -->
    <linearGradient id="hill" x1="0" y1="0" x2="0.08" y2="1">
      <stop offset="0" stop-color="#aae060" />
      <stop offset="0.10" stop-color="#88d13c" />
      <stop offset="0.34" stop-color="#68bb25" />
      <stop offset="0.62" stop-color="#4b9615" />
      <stop offset="1" stop-color="#2f6609" />
    </linearGradient>

    <filter id="cloud" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <filter id="cloudTight" x="-40%" y="-140%" width="180%" height="380%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
  </defs>

  <!-- 天空 -->
  <rect width="1600" height="900" fill="url(#sky)" />

  <!-- 云 -->
  <g filter="url(#cloud)" fill="#ffffff">
    <ellipse cx="230" cy="150" rx="240" ry="46" opacity="0.88" />
    <ellipse cx="345" cy="176" rx="160" ry="30" opacity="0.66" />
    <ellipse cx="1010" cy="105" rx="300" ry="52" opacity="0.92" />
    <ellipse cx="1175" cy="140" rx="185" ry="32" opacity="0.64" />
    <ellipse cx="1465" cy="248" rx="190" ry="40" opacity="0.70" />
    <ellipse cx="700" cy="300" rx="215" ry="36" opacity="0.46" />
    <ellipse cx="180" cy="360" rx="225" ry="34" opacity="0.30" />
    <ellipse cx="1300" cy="400" rx="250" ry="36" opacity="0.24" />
  </g>
  <g filter="url(#cloudTight)" fill="#ffffff" opacity="0.5">
    <ellipse cx="880" cy="205" rx="115" ry="22" />
    <ellipse cx="430" cy="245" rx="105" ry="19" />
  </g>

  <!-- 山丘：一条平缓的曲线，从左侧低处向右上升 -->
  <path d="M0,662 C230,650 450,622 700,590 C980,554 1300,530 1600,524 L1600,900 L0,900 Z"
        fill="url(#hill)" />

  <!-- 山脊高光：贴着山脊的一道亮草色，让坡面有被照亮的感觉 -->
  <path d="M0,662 C230,650 450,622 700,590 C980,554 1300,530 1600,524"
        fill="none" stroke="#c9f185" stroke-width="6" opacity="0.35" />
  <path d="M0,676 C230,664 450,637 700,606 C980,571 1300,548 1600,542"
        fill="none" stroke="#ffffff" stroke-width="14" opacity="0.07" />
</svg>
